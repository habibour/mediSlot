name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-postgres:
    name: Tests + coverage gate (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # unit + integration tests (Testcontainers: Postgres, Elasticsearch); fails below the JaCoCo line-coverage floor
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-postgres
          path: target/site/jacoco
          if-no-files-found: ignore

  test-mysql:
    name: Same suite on MySQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify -Dtest.db=mysql

  e2e:
    name: Docker stack + Postman collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/gen-env.sh
      - name: Build and start app + Postgres + Elasticsearch
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the Postman collection against the stack
        run: npx --yes newman@6 run postman/MediSlot.postman_collection.json -e postman/MediSlot.local.postman_environment.json
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v
        if: always()
